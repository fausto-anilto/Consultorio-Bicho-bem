<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF1EF; }
      .stroke-color { stroke: #7C3B40; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .text-color { fill: #7C3B40; font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
    </style>
    <!-- Caminho circular superior para o texto "BICHO BEM • CONSULTÓRIO" -->
    <path id="textCircleTop" d="M 75,250 A 175,175 0 1,1 425,250" />
    <!-- Caminho circular inferior para o texto "VETERINÁRIO" -->
    <path id="textCircleBottom" d="M 425,250 A 175,175 0 0,1 75,250" />
  </defs>

  <!-- Fundo Circular -->
  <circle cx="250" cy="250" r="240" class="bg" stroke="#7C3B40" stroke-width="2" stroke-opacity="0.15" />

  <!-- Círculo Guia / Moldura Externa -->
  <circle cx="250" cy="250" r="205" class="stroke-color" stroke-width="5" stroke-dasharray="750 40 80 40" stroke-dashoffset="180" />

  <!-- Tipografia Curva -->
  <text class="text-color" font-size="27" letter-spacing="4">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      BICHO BEM • CONSULTÓRIO
    </textPath>
  </text>
  <text class="text-color" font-size="28" letter-spacing="8">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      VETERINÁRIO
    </textPath>
  </text>

  <!-- Ilustração Linework: Cão e Gato Acolhidos -->
  <g id="mascot-illustration" transform="translate(145, 125) scale(0.85)">
    <!-- Silhueta da Cabeça e Orelha do Cão -->
    <path d="M 125,55 C 105,45 80,45 60,60 C 40,75 15,90 -25,95 C -45,100 -55,115 -50,125 C -45,135 -35,135 -20,135 C -5,135 15,155 30,165 C 45,175 55,185 55,195" 
          class="stroke-color" stroke-width="6.5" />
    
    <!-- Focinho e Nariz do Cão -->
    <path d="M -48,110 C -42,105 -35,112 -38,120 C -42,126 -50,122 -48,110 Z" fill="#7C3B40" />
    
    <!-- Olho do Cão (Gentil / Sorrindo) -->
    <path d="M 15,100 C 22,92 30,95 32,105" class="stroke-color" stroke-width="5.5" />

    <!-- Orelha Caída Suave do Cão -->
    <path d="M 75,70 C 85,90 90,125 75,145 C 60,160 50,150 50,130 C 50,105 60,85 75,70 Z" 
          class="stroke-color" stroke-width="6" />

    <!-- Dorso e Corpo Protetor do Cão envolvendo o Gatinho -->
    <path d="M 125,55 C 170,80 185,135 185,195 C 185,275 160,310 135,320" 
          class="stroke-color" stroke-width="6.5" />

    <!-- Corpo / Pata Frontal do Cão -->
    <path d="M 55,195 C 20,200 -20,225 -30,265 C -40,305 -15,345 35,345 C 75,345 110,335 135,320" 
          class="stroke-color" stroke-width="6.5" />

    <!-- Gatinho Aconchegado no Centro -->
    <!-- Cabeça e Orelhinhas do Gato -->
    <path d="M 45,210 L 35,180 L 60,195 C 75,190 95,190 110,195 L 135,180 L 125,210 C 138,225 140,245 130,265 C 120,285 95,290 75,290 C 55,290 35,275 35,250 C 35,230 40,220 45,210 Z" 
          class="stroke-color" stroke-width="5.5" fill="#FAF1EF" />
    
    <!-- Olhinhos Fechados e Calmos do Gatinho -->
    <path d="M 58,230 C 63,235 68,235 73,230" class="stroke-color" stroke-width="4.5" />
    <path d="M 98,230 C 103,235 108,235 113,230" class="stroke-color" stroke-width="4.5" />
    
    <!-- Focinho do Gatinho -->
    <path d="M 83,240 L 88,240 L 85.5,245 Z" fill="#7C3B40" />
    <path d="M 85.5,245 L 85.5,250 C 82,253 78,252 75,250" class="stroke-color" stroke-width="3.5" />
    <path d="M 85.5,250 C 89,253 93,252 96,250" class="stroke-color" stroke-width="3.5" />

    <!-- Corpo Enroladinho do Gato -->
    <path d="M 50,270 C 45,295 55,325 85,325 C 115,325 125,305 125,285" 
          class="stroke-color" stroke-width="5" />
  </g>
</svg>
